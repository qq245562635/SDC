<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逃离三国 · 第一批定画风</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17120f;color:#efe6d6;font:16px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:32px 24px}h1{font-size:36px;margin:0}p{color:#bcae9a}a{color:#65d1e5}nav{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#17120ff0;padding:14px 0;z-index:2}button{font:inherit;padding:7px 14px;border:1px solid #635044;background:#2b211b;color:#efe6d6;cursor:pointer;border-radius:5px}button[aria-pressed=true]{border-color:#65d1e5;color:#65d1e5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0;border:1px solid #4b382b;border-radius:8px;overflow:hidden}figure>a{display:block;background-color:#e9dfcd;background-image:conic-gradient(#d1c5b3 25%,transparent 0 50%,#d1c5b3 0 75%,transparent 0);background-size:24px 24px}img{display:block;width:100%;height:auto}figcaption{padding:10px 14px}figcaption a{float:right}body.dark figure>a{background:#2b211b}body.light figure>a{background:#f6f0e5}[hidden]{display:none!important}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style><main><h1>逃离三国 · 第一批定画风</h1><p>5 类 × 4 个方案 · 水墨粗线卡通 · 点击图片打开原图</p>
<p><a href="../../../prototype/hulao-camp.html">营地试玩 ↗</a>　<a href="index.md">完整提示词与交付说明 ↗</a></p>
<nav aria-label="筛选"><button data-filter="all" aria-pressed="true">全部 20 张</button><button data-filter="char_hero" aria-pressed="false">主角</button><button data-filter="char_soldier" aria-pressed="false">联军兵</button><button data-filter="env_tent" aria-pressed="false">营帐</button><button data-filter="prop_chest" aria-pressed="false">宝箱</button><button data-filter="key_art" aria-pressed="false">宣传图</button><button id="bg">切换底色：棋盘格</button></nav>
<div class="grid" id="gallery"></div><p>当前为概念参考页，角色动画、正式拆件和脚底锁点在定稿后制作。宣传图原生尺寸为 1672×941（约 16:9）。</p></main>
<script>
const assets=[{"name":"char_hero_01.png","stem":"char_hero"},{"name":"char_hero_02.png","stem":"char_hero"},{"name":"char_hero_03.png","stem":"char_hero"},{"name":"char_hero_04.png","stem":"char_hero"},{"name":"char_soldier_01.png","stem":"char_soldier"},{"name":"char_soldier_02.png","stem":"char_soldier"},{"name":"char_soldier_03.png","stem":"char_soldier"},{"name":"char_soldier_04.png","stem":"char_soldier"},{"name":"env_tent_01.png","stem":"env_tent"},{"name":"env_tent_02.png","stem":"env_tent"},{"name":"env_tent_03.png","stem":"env_tent"},{"name":"env_tent_04.png","stem":"env_tent"},{"name":"prop_chest_01.png","stem":"prop_chest"},{"name":"prop_chest_02.png","stem":"prop_chest"},{"name":"prop_chest_03.png","stem":"prop_chest"},{"name":"prop_chest_04.png","stem":"prop_chest"},{"name":"key_art_01.png","stem":"key_art"},{"name":"key_art_02.png","stem":"key_art"},{"name":"key_art_03.png","stem":"key_art"},{"name":"key_art_04.png","stem":"key_art"}];
const names={char_hero:'主角三视图',char_soldier:'联军兵三色与拆件',env_tent:'营帐三色 · 完好与破损',prop_chest:'三档宝箱 · 关闭与打开',key_art:'宣传主视觉'};
for(const a of assets){const f=document.createElement('figure');f.dataset.stem=a.stem;f.innerHTML='<a href="'+a.name+'" target="_blank" rel="noopener"><img loading="lazy" src="'+a.name+'" alt="'+names[a.stem]+' '+a.name+'"></a><figcaption>'+a.name+'<a download href="'+a.name+'">下载 PNG</a></figcaption>';document.getElementById('gallery').append(f);}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('figure').forEach(f=>f.hidden=b.dataset.filter!=='all'&&b.dataset.filter!==f.dataset.stem);});
let bg=0;document.getElementById('bg').onclick=()=>{bg=(bg+1)%3;document.body.className=['','dark','light'][bg];document.getElementById('bg').textContent='切换底色：'+['棋盘格','深色','浅色'][bg];};
</script></html>

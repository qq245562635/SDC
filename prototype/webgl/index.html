<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>逃离三国 · 虎牢关原型</title>
<style>
  html, body { margin: 0; height: 100%; background: #16110d; overflow: hidden; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game canvas { image-rendering: auto; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #err { position: fixed; left: 16px; right: 16px; top: 16px; color: #f3e9d2; font: 14px/1.5 sans-serif; }
</style>
</head>
<body>
<div id="game"></div>
<div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  if (!window.Phaser) document.getElementById('err').textContent = 'Phaser 没有加载成功，请检查网络后刷新。';
  if (location.protocol === 'file:') document.getElementById('err').textContent = '浏览器不允许直接从文件加载贴图：请双击 start.bat（或在本目录运行 python -m http.server 8000）后访问 http://localhost:8000';
</script>
<script src="assets/art/manifest.js"></script>
<script src="game.js"></script>
</body>
</html>
